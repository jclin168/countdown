<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precision Countdown</title>
<style>
  :root{
    --bg:#0E1216; --panel:#161C22; --line:#243039;
    --phos:#4FD9E8; --amber:#E8B24F; --red:#E86A5A;
    --green:#5FD08A; --pink:#E88AB8;
    --idle:#7A8A95;
    --dim:#6B7A85; --fg:#E8EEF2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font-family:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .unit{width:100%;max-width:440px;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;overflow:hidden;
    position:relative;z-index:1}
  .head{display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;border-bottom:1px solid var(--line);
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .led{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .15s}
  .led.on{background:var(--phos);box-shadow:0 0 8px var(--phos)}
  .led.done{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .head .right{display:flex;align-items:center;gap:9px}
  .tag{font-size:9px;letter-spacing:.16em;color:#2E3A44;transition:color .2s}
  .tag.on{color:var(--phos)}
  .tag.na{color:#2E3A44;text-decoration:line-through}

  .wall{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:10px 14px;border-bottom:1px solid var(--line)}
  body.running .wall b{color:var(--phos)}
  .wall b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;
    letter-spacing:.01em}
  .wall b em{font-style:normal;opacity:.5;font-size:.72em}
  .wall span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);text-align:right;line-height:1.5}

  .readout{padding:30px 14px 20px;text-align:center}
  .digits{font-size:clamp(30px,10vw,46px);font-weight:500;line-height:1;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
    letter-spacing:-.01em;color:var(--phos);white-space:nowrap}
  .digits .tenth{color:var(--fg);opacity:.55;font-size:.6em}
  /* parked reads slate, live reads phosphor, expired reads amber.
     The colour is the state indicator, so the number can be read at a
     glance without checking the LED or the buttons. */
  body:not(.running) .digits{color:var(--idle)}
  body:not(.running) .bar span{background:var(--idle)}
  .digits.expired,body:not(.running) .digits.expired{color:var(--amber)}
  .sub{margin-top:10px;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);min-height:12px}
  .bar{height:2px;background:var(--line);margin:20px 0 0;position:relative}
  .bar span{position:absolute;inset:0 auto 0 0;background:var(--phos);width:100%;
    transform-origin:left;will-change:transform}

  .tabs{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .tabs button{flex:1;background:var(--panel);color:var(--dim)}
  .tabs button[aria-selected="true"]{background:#1D252C;color:var(--phos)}

  .diag{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
  .diag div{padding:9px 4px;text-align:center;border-right:1px solid var(--line)}
  .diag div:last-child{border-right:none}
  .diag b{display:block;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
  .diag i{font-style:normal;font-size:8px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim)}

  /* Graded quality scale, shared by the diagnostics cells, the wall clock
     meta line and the source line. One vocabulary everywhere, so a colour
     means the same thing wherever it appears. */
  .q0,.diag b.q0{color:var(--green)}   /* offset < 100 ms  */
  .q1,.diag b.q1{color:var(--amber)}   /* offset < 500 ms  */
  .q2,.diag b.q2{color:var(--pink)}    /* offset < 1000 ms */
  .q3,.diag b.q3{color:var(--red)}     /* offset >= 1 s, or unsynced */

  .controls{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  button{flex:1;appearance:none;border:0;background:var(--panel);color:var(--fg);
    font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:13px 4px;cursor:pointer}
  button:hover:not(:disabled){background:#1D252C}
  button:focus-visible{outline:2px solid var(--phos);outline-offset:-2px}
  button:disabled{color:#3A464F;cursor:default}

  .setter{display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-top:1px solid var(--line);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim)}
  .setter.hidden{display:none}
  .setter label{flex-shrink:0}
  input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
    color:var(--fg);font:inherit;font-size:13px;padding:6px 8px;border-radius:3px}
  input[type=number]{text-align:right;flex:0 0 90px}
  input[type=time]{text-align:right;flex:0 0 120px}
  input:focus{outline:1px solid var(--phos)}
  .note{padding:0 14px 12px;font-size:9px;line-height:1.6;color:var(--dim);
    letter-spacing:.04em}
  .credit{padding-top:0;opacity:.7}
  .pulse{display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--amber);margin-right:5px;vertical-align:middle;
    animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .credit a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
  .credit a:hover{color:var(--phos)}

  .opt{display:flex;align-items:center;gap:9px;padding:11px 14px;
    border-top:1px solid var(--line);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);cursor:pointer}
  .opt input{flex:0 0 auto;width:14px;height:14px;accent-color:var(--phos);cursor:pointer}

  details.opts{border-top:1px solid var(--line)}
  details.opts summary{display:flex;align-items:center;gap:10px;padding:11px 14px;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    cursor:pointer;list-style:none;user-select:none}
  details.opts summary::-webkit-details-marker{display:none}
  details.opts summary:hover{color:var(--fg)}
  details.opts summary:focus-visible{outline:2px solid var(--phos);outline-offset:-2px}
  details.opts summary .state{color:var(--phos);opacity:.75;letter-spacing:.06em}
  details.opts summary .chev{margin-left:auto;font-size:10px;
    transition:transform .15s}
  details.opts[open] summary .chev{transform:rotate(90deg)}

  /* layer 0: full-bleed flash behind the instrument
     layer 1: the unit, untouched and fully opaque
     layer 2: a low-alpha wash so the flash reads across the panel too */
  #flash{position:fixed;inset:0;z-index:0;background:var(--flash-c,#000);display:none}
  #flashWash{position:fixed;inset:0;z-index:2;background:var(--flash-c,transparent);
    opacity:.20;pointer-events:none;display:none}
  #flashHint{position:fixed;left:0;right:0;bottom:5vh;z-index:3;margin:0;
    text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:#fff;mix-blend-mode:difference;pointer-events:none;display:none}

  /* layer 4: final-seconds cue. Hollow stroke, so the readout on the
     panel underneath stays legible straight through the numeral. */
  #cue{position:fixed;inset:0;z-index:4;display:none;
    align-items:center;justify-content:center;pointer-events:none}
  body.cueing #cue{display:flex}
  #cue b{font-weight:600;line-height:.78;font-size:clamp(150px,52vw,300px);
    letter-spacing:-.05em;font-variant-numeric:tabular-nums;
    color:transparent;-webkit-text-stroke:2px #fff;
    mix-blend-mode:difference}
  #cue b.word{font-size:clamp(56px,18vw,120px);letter-spacing:.1em;
    color:#fff;-webkit-text-stroke:0}

  body.flashing #flash,body.flashing #flashWash,body.flashing #flashHint{display:block}
  body.flashing #flash{cursor:pointer}
  body.flashing .unit{border-color:rgba(255,255,255,.35)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="unit">
  <div class="head"><span>Precision Countdown</span>
    <span class="right">
      <span class="tag" id="awake">awake</span>
      <span class="led" id="led"></span>
    </span>
  </div>

  <div class="wall" id="wall">
    <b id="wallTime">--:--:--<em>.-</em></b>
    <span id="wallMeta">syncing</span>
  </div>

  <div class="readout">
    <div class="digits" id="digits"><span id="dMain">--:--</span><span class="tenth" id="dFrac">.---</span></div>
    <div class="sub" id="sub"></div>
    <div class="bar"><span id="bar"></span></div>
  </div>

  <div class="tabs" role="tablist">
    <button id="tabTgt" role="tab" aria-selected="true">Target time</button>
    <button id="tabDur" role="tab" aria-selected="false">Duration</button>
  </div>

  <div class="setter" id="setTgt">
    <label for="tgt">Count to</label>
    <input id="tgt" type="time" step="1">
  </div>

  <div class="setter hidden" id="setDur">
    <label for="dur">Seconds</label>
    <input id="dur" type="number" min="0.1" step="0.1" value="30">
  </div>

  <div class="diag">
    <div><b id="fps">—</b><i>ui fps</i></div>
    <div><b id="offset">—</b><i>offset ms</i></div>
    <div><b id="unc">—</b><i>± ms</i></div>
    <div><b id="skew">—</b><i>ppm</i></div>
  </div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="resetBtn">Reset</button>
    <button id="syncBtn">Sync</button>
  </div>

  <details class="opts">
    <summary>Alerts <span class="state" id="optState"></span><span class="chev">▶</span></summary>

    <label class="opt" for="flashOn">
      <input type="checkbox" id="flashOn" checked>
      Flash alert at zero
    </label>

    <label class="opt" for="beepOn">
      <input type="checkbox" id="beepOn" checked>
      Beep on final five
    </label>

    <label class="opt" for="wakeOn">
      <input type="checkbox" id="wakeOn" checked>
      Keep screen awake while running
    </label>
  </details>

  <p class="note" id="srcNote">Clock source: local device</p>
  <p class="note credit">Time sources:
    <a href="https://time.now" target="_blank" rel="noopener">World Time API by Time.Now</a>,
    gettimeapi.dev, timeapi.io, worldtimeapi.org</p>
</div>

<div id="flash" aria-hidden="true"></div>
<div id="flashWash" aria-hidden="true"></div>
<div id="cue" aria-hidden="true"><b></b></div>
<p id="flashHint" role="alert" aria-live="assertive">Tap or press Esc to dismiss</p>

<script>
/* =================================================================
   1. ClockSync — network time discipline
   -----------------------------------------------------------------
   Browsers cannot speak NTP. NTP is UDP/123 and a page has no UDP
   socket, so this uses Cristian's algorithm over HTTPS, which is the
   same offset maths NTP uses minus the stratum hierarchy:

       t0     = perf clock before request
       T      = timestamp reported by the server
       t1     = perf clock after response
       rtt    = t1 - t0
       offset = T + rtt/2 - t1        (assumes symmetric path)

   Several samples are taken and the one with the LOWEST rtt wins.
   That is NTP's own filter: the fastest round trip has the least
   path asymmetry, so it carries the smallest hidden error.

   The result is stored as `base`, an epoch value pinned to the
   performance.now() origin. Every later time read is
   base + performance.now(), so the reading stays monotonic even if
   the OS clock is stepped mid-countdown.
   ================================================================= */

/* Purpose-built time services only. cdn-cgi/trace is deliberately absent:
   it is Cloudflare's connection-debug endpoint, not a time service. Its
   ts field is whatever the edge happened to stamp while assembling a
   diagnostic page, it carries no accuracy commitment, no stability
   guarantee, and no notice if the field is renamed or dropped. Precise
   digits from an endpoint that never promised to be a clock are worse
   than fewer digits from one that did — the error becomes unbounded and
   silent. Cloudflare does run a real time service at time.cloudflare.com,
   but that speaks NTP over UDP and no page can reach it. */

const SOURCES = [
  { name: 'time.now',
    url: 'https://time.now/developer/api/timezone/Etc/UTC',
    async parse(res) {
      const j = await res.json();
      // utc_datetime carries microseconds; Date.parse truncates to ms,
      // which is well below the path-asymmetry noise floor anyway
      const t = Date.parse(j.utc_datetime || j.datetime);
      if (!Number.isFinite(t)) throw new Error('bad datetime');
      return t;
    } },
  { name: 'gettimeapi.dev',
    url: 'https://gettimeapi.dev/v1/time?timezone=UTC',
    async parse(res) {
      const j = await res.json();                 // time carries microseconds
      const t = Date.parse(`${j.date}T${j.time}Z`);
      if (!Number.isFinite(t)) throw new Error('bad time');
      return t;
    } },
  { name: 'timeapi.io',
    url: 'https://timeapi.io/api/Time/current/zone?timeZone=UTC',
    async parse(res) {
      const j = await res.json();
      const t = Date.parse(j.dateTime.endsWith('Z') ? j.dateTime : j.dateTime + 'Z');
      if (!Number.isFinite(t)) throw new Error('bad dateTime');
      return t;                                 // millisecond precision
    } },
  { name: 'worldtimeapi.org',
    url: 'https://worldtimeapi.org/api/timezone/Etc/UTC',
    async parse(res) {
      const j = await res.json();
      return Date.parse(j.utc_datetime);        // microsecond precision
    } },
  { name: 'time.now Date header',
    url: 'https://time.now/developer/api/timezone/Etc/UTC',
    fallback: true,                              // never ranked, always last
    async parse(res) {
      // survives a body-schema change at the same service. 1 s granularity,
      // so it is a floor to stay above, not a source to prefer.
      const d = res.headers.get('date');
      if (!d) throw new Error('Date header not exposed by CORS');
      return Date.parse(d) + 500;               // centre the 1 s bucket
    } }
];

/* What counts as a usable fix. A source that responds but scatters is
   not "available" in any sense that matters — these bounds are what the
   fallback chain tests against, not mere reachability. */
const RELIABLE = { minSamples: 3, maxSpread: 150, maxRtt: 1200 };

class ClockSync {
  base = Date.now() - performance.now();   // epoch at perf origin
  uncertainty = Infinity;
  rtt = null;
  synced = false;                          // true once a remote source answered
  degraded = false;                        // synced, but below the quality bar
  dispersion = null;                       // spread across accepted samples
  source = 'local device';
  granularity = 0;
  skewPpm = null;
  timing = 'wall';                         // 'resource' once TAO is available
  probeTable = [];                         // measured RTT per source, ranked
  #history = [];
  #lastAt = 0;
  #onChange = null;
  #onStatus = null;
  #ranked = null;

  onChange(fn) { this.#onChange = fn; return this; }
  onStatus(fn) { this.#onStatus = fn; return this; }

  /* A sync is six samples against one of five providers, preceded by a
     warm-up and sometimes a full re-rank of every source. That is several
     seconds of work behind a label that otherwise sits frozen on the last
     result. Reporting the phase shows which provider is being talked to
     and how far along it is, so a slow network reads as slow rather than
     as broken. */
  #say(phase, detail = '') {
    this.status = { phase, detail };
    this.#onStatus?.(this.status);
  }

  // a dead or slow source must not stall the chain behind it
  async #fetch(url, ms = 2500) {
    const ac = new AbortController();
    const kill = setTimeout(() => ac.abort(), ms);
    try { return await fetch(url, { cache: 'no-store', mode: 'cors', signal: ac.signal }); }
    finally { clearTimeout(kill); }
  }

  /* Skew compensation. A consumer crystal drifts 10-50 ppm, so between
     two syncs the offset established at the last handshake is already
     going stale. Once a rate estimate exists it is projected forward,
     which is the difference between holding ~1 ms and ~15 ms over a
     five-minute gap. */
  now() {
    const p = performance.now();
    const corr = this.skewPpm ? (p - this.#lastAt) * this.skewPpm / 1e6 : 0;
    return this.base + p + corr;
  }

  async #sample(src) {
    // unique URL: defeats any cache and gives this request its own
    // resource-timing entry to look up afterwards
    const url = src.url + (src.url.includes('?') ? '&' : '?') +
                '_=' + Math.random().toString(36).slice(2);
    const t0 = performance.now();
    const res = await this.#fetch(url);
    const t1 = performance.now();
    const serverMs = await src.parse(res);

    /* Prefer Resource Timing over the fetch wrapper. t0/t1 measured in
       JS include promise scheduling, CORS preflight bookkeeping and the
       body read — all of which inflate the apparent RTT and therefore
       the rtt/2 correction. requestStart -> responseStart is the wire
       interval to the first response byte, which is the moment closest
       to when the server stamped the time. Needs Timing-Allow-Origin
       on the response; falls back silently when the fields are zeroed. */
    let a = t0, b = t1, timing = 'wall';
    const e = performance.getEntriesByName(url).pop();
    if (e && e.requestStart > 0 && e.responseStart > e.requestStart) {
      a = e.requestStart; b = e.responseStart; timing = 'resource';
    }
    return { base: serverMs + (b - a) / 2 - b, rtt: b - a, timing };
  }

  /* Connection warm-up. The first request to a host pays DNS, TCP and
     TLS before a single byte of the response exists — one to three extra
     round trips folded into the measurement. Discarding one throwaway
     request leaves the socket open, so the samples that follow measure
     only the request/response leg. This is the single largest RTT
     reduction available from the browser, typically halving it.
     It doubles as a reachability probe: a source that fails here is
     skipped without burning six sample attempts on it. */
  async #warm(src) {
    try { await this.#fetch(src.url + (src.url.includes('?') ? '&' : '?') + '_warm=1', 2500);
          return true; }
    catch { return false; }
  }

  /* Rank the providers by MEASURED round trip, not by a hardcoded guess.
     Hop count is what governs the path-asymmetry error that dominates
     the whole estimate, and no static ordering can know which provider
     sits nearest to this particular client — an anycast edge that is two
     hops away in Frankfurt may be twelve away in Taipei. Each source is
     warmed, then sampled once, sequentially: probing in parallel would
     have the requests contend for the same uplink and corrupt exactly
     the number being measured. */
  async #rank({ skip = null } = {}) {
    const pool = SOURCES.filter(s => !s.fallback && s !== skip);
    const scored = [];
    let n = 0;
    for (const src of pool) {
      this.#say('probing', `${src.name} (${++n}/${pool.length})`);
      if (!await this.#warm(src)) continue;        // unreachable, drop it
      try {
        const s = await this.#sample(src);
        scored.push({ src, rtt: s.rtt });
      } catch { /* parse failure: not a usable source */ }
    }
    scored.sort((a, b) => a.rtt - b.rtt);
    this.probeTable = scored.map(s => `${s.src.name} ${s.rtt.toFixed(0)}`);
    this.#ranked = [...scored.map(s => s.src), ...SOURCES.filter(s => s.fallback)];
    return this.#ranked;
  }

  // measure one source. Returns a candidate, or null if it gave nothing.
  async #measure(src, samples) {
    this.#say('connecting', src.name);
    if (!await this.#warm(src)) return null;

    const good = [];
    for (let i = 0; i < samples; i++) {
      this.#say('sampling', `${src.name} ${i + 1}/${samples}`);
      try { good.push(await this.#sample(src)); }
      catch { break; }
      await new Promise(r => setTimeout(r, 110));   // avoid burst throttling
    }
    if (!good.length) return null;

    // minimum-delay filter: the fastest round trip has the least room
    // for the path asymmetry that Cristian's rtt/2 term cannot see
    const best = good.reduce((a, b) => (b.rtt < a.rtt ? b : a));

    // agreement across samples is the honest error bar. A tight cluster
    // over a fast path means the estimate is real; a wide spread means
    // the half-RTT figure is flattering itself.
    const bases = good.map(s => s.base).sort((x, y) => x - y);
    return { src, best, spread: bases.at(-1) - bases[0], n: good.length };
  }

  /* Reliable means the source answered enough times and agreed with
     itself. Reachability alone is not enough — a provider that responds
     but whose samples scatter over half a second is worse than useless,
     because it hands back a confident-looking offset built on noise. */
  #reliable(c) {
    return c && c.n >= RELIABLE.minSamples
             && c.spread <= RELIABLE.maxSpread
             && c.best.rtt <= RELIABLE.maxRtt;
  }

  #commit(c) {
    const prev = this.#history.at(-1);
    const at = performance.now();

    this.synced = true;
    this.base = c.best.base;
    this.rtt = c.best.rtt;
    this.uncertainty = c.best.rtt / 2;
    this.dispersion = c.spread;
    this.source = c.src.name;
    this.timing = c.best.timing;
    this.granularity = c.src.fallback ? 1000 : 1;   // Date header buckets to 1 s
    this.degraded = !this.#reliable(c);

    // two syncs far enough apart expose the local crystal's rate error.
    // Only meaningful when both came from the same path, so a source
    // change resets the history rather than differencing across providers.
    if (prev && prev.source === this.source && at - prev.at > 60000) {
      this.skewPpm = ((this.base - prev.base) / (at - prev.at)) * 1e6;
    } else if (prev && prev.source !== this.source) {
      this.skewPpm = null;
    }
    this.#history.push({ base: this.base, at, source: this.source });
    this.#lastAt = at;
    this.#say('synced', c.src.name);
    this.#onChange?.(this);
  }

  /* One source, every time: PRIMARY.
     Probing every provider on each sync costs a request per source for a
     result that rarely changes, and switching sources between syncs means
     consecutive offsets carry different systematic errors — the countdown
     would inherit a step every time the winner changed. Staying on one
     provider also keeps the skew estimate meaningful, because it compares
     two measurements of the same path rather than two different paths.

     The alternates exist for one case: the primary came back unavailable
     or unreliable. Only then is the RTT ranking worth its cost, since at
     that point the question really is which of the remainder is nearest.
     If nothing clears the quality bar, the best candidate seen is still
     committed and flagged degraded — a noisy remote fix beats the
     unsynced device clock, but the user should be told which they have. */
  async sync({ samples = 6 } = {}) {
    const primary = SOURCES[0];
    const seen = [];

    const first = await this.#measure(primary, samples);
    if (this.#reliable(first)) { this.#commit(first); return this; }
    if (first) seen.push(first);

    await this.#rank({ skip: primary });
    for (const src of this.#ranked) {
      const c = await this.#measure(src, samples);
      if (this.#reliable(c)) { this.#commit(c); return this; }
      if (c) seen.push(c);
    }

    if (seen.length) {                     // nothing clean, take the least bad
      this.#commit(seen.reduce((a, b) => (b.spread < a.spread ? b : a)));
      return this;
    }

    this.synced = false;
    this.degraded = false;
    this.#say('unsynced');
    this.source = 'local device (all sources unreachable)';
    this.#onChange?.(this);
    return this;
  }
}

/* =================================================================
   2. HiResCountdown — the deadline is always absolute
   -----------------------------------------------------------------
   The deadline lives in the performance.now() domain. A duration
   deadline is now + ms. A wall-clock target is converted once:
       endPerf = targetEpoch - clock.base
   so a resync that moves `base` simply retargets the same loop and
   the display corrects on the next frame.
   ================================================================= */

const STEP_MS = 1;      // one displayed unit = 1 ms

class HiResCountdown {
  #end = 0; #remaining = 0; #rafId = null; #safety = null;
  #running = false; #lastStep = -1;

  constructor(handlers = {}) {
    Object.assign(this, handlers);
    document.addEventListener('visibilitychange', this.#resync);
  }

  get running() { return this.#running; }
  get remaining() { return this.#running ? Math.max(0, this.#end - performance.now()) : this.#remaining; }

  load(ms, span) { this.span = span ?? ms; this.#remaining = Math.max(0, ms);
    this.#running = false; this.#stop(); this.#lastStep = -1; this.#emit(this.#remaining); }

  start() { this.startAt(performance.now() + this.#remaining); }

  // arm against a deadline already expressed in the perf domain.
  // Target mode uses this so the countdown never derives from a
  // remaining value that was computed at some earlier moment.
  startAt(endPerf) {
    const remaining = Math.max(0, endPerf - performance.now());
    if (this.#running || remaining <= 0) return;
    this.#stop();
    this.#running = true;
    this.#end = endPerf;
    this.#remaining = remaining;
    this.#lastStep = -1;
    this.#safety = setTimeout(() => this.#frame(), remaining + 20);
    this.onState?.('running');
    this.#frame();
  }

  // called after a resync: move the deadline, keep the loop alive
  retarget(endPerf) {
    if (this.#running) { this.#end = endPerf; this.#lastStep = -1; this.#frame(); }
    else { this.#remaining = Math.max(0, endPerf - performance.now()); this.#lastStep = -1; this.#emit(this.#remaining); }
  }

  pause() {
    if (!this.#running) return;
    this.#remaining = this.remaining;
    this.#stop(); this.#running = false; this.onState?.('paused');
  }

  destroy() { this.#stop(); document.removeEventListener('visibilitychange', this.#resync); }

  #stop() {
    if (this.#rafId !== null) cancelAnimationFrame(this.#rafId);
    if (this.#safety !== null) clearTimeout(this.#safety);
    this.#rafId = this.#safety = null;
  }

  // rAF is parked in a hidden tab; the deadline is still authoritative
  #resync = () => { if (this.#running && !document.hidden) this.#frame(); };

  #frame = () => {
    const remaining = Math.max(0, this.#end - performance.now());
    this.#emit(remaining);
    if (remaining === 0) {
      this.#stop(); this.#running = false; this.#remaining = 0;
      this.onState?.('done'); this.onComplete?.();
      return;
    }
    this.#rafId = requestAnimationFrame(this.#frame);
  };

  #emit(remaining) {
    // ceil so a full 30.000 s reads 30.000 and .000 appears only at zero.
    // At 1 ms resolution the gate no longer suppresses much — rAF fires
    // every 8-16 ms, so nearly every frame carries a new value. The saving
    // moved into onTick instead, where the minutes field is only rewritten
    // when it actually changes.
    const step = Math.ceil(remaining / STEP_MS);
    if (step === this.#lastStep) return;
    this.#lastStep = step;
    this.onTick?.(remaining, step);
  }
}

/* =================================================================
   3. FlashAlert — red/blue alert that does not hide the readout
   -----------------------------------------------------------------
   Three stacked layers instead of one covering overlay:

     z0  #flash      full-bleed colour, behind everything
     z1  .unit       the instrument, opaque and untouched
     z2  #flashWash  same colour at 20% alpha, pointer-events none

   The wash lets the colour read across the panel so the alert still
   feels full-screen, while the digits keep their original contrast
   against #161C22. Both layers read one CSS custom property, so a
   phase change is a single write on the root element rather than
   two style mutations.

   Rate is deliberately capped. WCAG 2.3.1 sets the threshold at
   3 flashes per second, and saturated red gets its own stricter
   clause because red-to-blue transitions are the highest-risk
   pattern for photosensitive epilepsy. A full-bleed layer is far
   past the small-area exemption, so rate is the only lever left:

     PERIOD 250 ms per colour -> 2 flash cycles per second
     colours held off full saturation (#B32B26 / #1E3FA8)

   Driven by the same rAF + absolute-deadline discipline as the
   countdown, so the 5 s duration and the phase boundaries stay
   exact rather than accumulating per-frame error.
   ================================================================= */

const FLASH = { RED:'#B32B26', BLUE:'#1E3FA8', PERIOD:250, DURATION:5000 };

class FlashAlert {
  #raf = null; #start = 0; #end = 0; #phase = -1; #reduced = false;

  constructor(plate) {
    plate.addEventListener('click', () => this.stop());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') this.stop(); });
  }

  #paint(colour) { document.documentElement.style.setProperty('--flash-c', colour); }

  fire() {
    this.#reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.#start = performance.now();
    this.#end = this.#start + FLASH.DURATION;
    this.#phase = -1;
    document.body.classList.add('flashing');
    // reduced-motion users get the same 5 s alert as a steady field, no strobe
    if (this.#reduced) this.#paint(FLASH.RED);
    this.#tick();
  }

  stop() {
    if (this.#raf !== null) cancelAnimationFrame(this.#raf);
    this.#raf = null;
    document.body.classList.remove('flashing');
    this.#paint('transparent');
    cue.hide();
  }

  #tick = () => {
    const now = performance.now();
    if (now >= this.#end) return this.stop();
    if (!this.#reduced) {
      const phase = Math.floor((now - this.#start) / FLASH.PERIOD) % 2;
      if (phase !== this.#phase) {          // one write per phase, not per frame
        this.#phase = phase;
        this.#paint(phase ? FLASH.BLUE : FLASH.RED);
      }
    }
    this.#raf = requestAnimationFrame(this.#tick);
  };
}

/* =================================================================
   4. BigCue — 5 4 3 2 1 NOW
   -----------------------------------------------------------------
   No timer of its own. The value is derived from the countdown's
   own remaining time on every tick:

       secs = Math.ceil(remaining / 1000)

   so the cue cannot drift away from the readout, and a resync that
   moves the deadline moves the cue with it. The ceil is what makes
   4.9 s read "5" and 0.1 s read "1", with NOW reserved for zero.

   Numerals render as a hollow stroke rather than solid fill, so the
   MM:SS.T readout stays legible through the middle of the numeral.
   ================================================================= */

class BigCue {
  #node; #last = null; #hold = null;

  constructor(node) { this.#node = node; }

  show(text, { word = false, holdMs = 0 } = {}) {
    if (text === this.#last) return;          // one write per second, not per frame
    this.#last = text;
    clearTimeout(this.#hold);
    this.#node.textContent = text;
    this.#node.classList.toggle('word', word);
    document.body.classList.add('cueing');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      this.#node.animate(
        [{ transform:'scale(1.22)', opacity:0 }, { transform:'scale(1)', opacity:1 }],
        { duration:200, easing:'cubic-bezier(.2,.9,.3,1)' }
      );
    }
    if (holdMs) this.#hold = setTimeout(() => this.hide(), holdMs);
  }

  hide() {
    clearTimeout(this.#hold);
    this.#last = null;
    document.body.classList.remove('cueing');
  }
}

/* =================================================================
   5. Beeper — five short pips, one long tone at zero
   -----------------------------------------------------------------
   Not fired from the rAF tick. The audio hardware runs on its own
   clock and rAF is subject to compositor jitter, so a pip triggered
   from a frame callback lands wherever that frame lands — tens of
   milliseconds off, and audibly ragged against a visual cue.

   Instead the whole sequence is scheduled ahead against
   AudioContext.currentTime, which is sample-accurate. Arming maps
   the deadline once:

       audioZero = ctx.currentTime + msToZero / 1000

   and every pip is placed at audioZero - k. A resync that moves the
   deadline calls arm() again, which cancels the pending oscillators
   and re-places them. Envelopes ramp over 5 ms rather than starting
   at full gain, otherwise the discontinuity clicks.
   ================================================================= */

class Beeper {
  #ctx = null; #pending = []; #enabled = () => true;

  constructor(isEnabled) { if (isEnabled) this.#enabled = isEnabled; }

  get ctx() {
    if (!this.#ctx) this.#ctx = new (window.AudioContext || window.webkitAudioContext)();
    return this.#ctx;
  }

  // must run inside a user gesture, before any await
  unlock() { if (this.ctx.state === 'suspended') this.ctx.resume(); }

  cancel() {
    for (const osc of this.#pending) { try { osc.stop(); } catch {} }
    this.#pending = [];
  }

  #tone(at, freq, dur, peak) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, at);
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(peak, at + 0.005);   // no click on attack
    gain.gain.setValueAtTime(peak, at + dur - 0.03);
    gain.gain.linearRampToValueAtTime(0, at + dur);        // no click on release
    osc.connect(gain).connect(ctx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.02);
    this.#pending.push(osc);
  }

  arm(msToZero) {
    this.cancel();
    if (!this.#enabled() || !(msToZero > 0)) return;
    const ctx = this.ctx;
    const zero = ctx.currentTime + msToZero / 1000;
    for (let k = 5; k >= 1; k--) {
      const at = zero - k;
      if (at > ctx.currentTime + 0.02) this.#tone(at, 880, 0.09, 0.22);  // short pip
    }
    this.#tone(zero, 440, 0.80, 0.30);                                    // long tone
  }
}

/* =================================================================
   6. ScreenLock — Screen Wake Lock API
   -----------------------------------------------------------------
   A phone dimming and sleeping mid-countdown is not a cosmetic
   problem here. A sleeping screen means rAF is parked, the visual
   cue never renders, and on some platforms the audio graph is
   suspended too — the whole alert misses.

   Three facts drive the design:

   1. The request needs a visible document, and Safari needs a user
      gesture. So acquire() is called straight from the Start click,
      before any await, exactly like the AudioContext unlock.
   2. The OS releases the lock whenever the tab is hidden, and does
      NOT hand it back on return. A visibilitychange listener has to
      re-take it, otherwise the lock silently dies the first time
      the user switches apps.
   3. It is not universally supported — iOS only from Safari 16.4.
      Unsupported is reported in the header rather than pretended.
   ================================================================= */

class ScreenLock {
  supported = 'wakeLock' in navigator;
  #lock = null;
  #want = false;
  #onChange = null;

  constructor(onChange) {
    this.#onChange = onChange;
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) this.#take();     // re-take after backgrounding
    });
  }

  get held() { return this.#lock !== null; }

  async acquire() { this.#want = true; await this.#take(); }

  async release() {
    this.#want = false;
    try { await this.#lock?.release(); } catch {}
    this.#lock = null;
    this.#onChange?.(this);
  }

  async #take() {
    if (!this.supported || !this.#want || this.#lock || document.hidden) return;
    try {
      this.#lock = await navigator.wakeLock.request('screen');
      this.#lock.addEventListener('release', () => {
        this.#lock = null;                    // OS took it back
        this.#onChange?.(this);
      });
    } catch { this.#lock = null; }            // denied, e.g. battery saver
    this.#onChange?.(this);
  }
}

/* ================= formatting ================= */

function format(step) {              // step = remaining milliseconds, ceiled
  const ms = step % 1000;
  let s = (step - ms) / 1000;
  const sec = s % 60; s = (s - sec) / 60;
  const min = s % 60; s = (s - min) / 60;
  const hr  = s % 24;
  const day = (s - hr) / 24;
  const p = n => String(n).padStart(2, '0');
  const main = day ? `${day}d ${p(hr)}:${p(min)}:${p(sec)}`
             : hr  ? `${p(hr)}:${p(min)}:${p(sec)}`
             :       `${p(min)}:${p(sec)}`;
  return { main, frac: String(ms).padStart(3, '0') };
}

/* ================= wiring ================= */

const $ = id => document.getElementById(id);
const el = {
  digits:$('digits'), dMain:$('dMain'), dFrac:$('dFrac'), sub:$('sub'), bar:$('bar'), led:$('led'),
  fps:$('fps'), offset:$('offset'), unc:$('unc'), skew:$('skew'),
  start:$('startBtn'), pause:$('pauseBtn'), reset:$('resetBtn'), sync:$('syncBtn'),
  dur:$('dur'), tgt:$('tgt'), tabDur:$('tabDur'), tabTgt:$('tabTgt'),
  setDur:$('setDur'), setTgt:$('setTgt'), note:$('srcNote'),
  flash:$('flash'), flashOn:$('flashOn'), beepOn:$('beepOn'),
  wallTime:$('wallTime'), wallMeta:$('wallMeta'),
  wakeOn:$('wakeOn'), awake:$('awake'), optState:$('optState'),
  cue:document.querySelector('#cue b')
};

const flash = new FlashAlert(el.flash);
const cue = new BigCue(el.cue);
const beeper = new Beeper(() => el.beepOn.checked);
const screenLock = new ScreenLock(s => {
  el.awake.className = 'tag' + (!s.supported ? ' na' : s.held ? ' on' : '');
  el.awake.title = !s.supported
    ? 'Screen Wake Lock not supported by this browser'
    : s.held ? 'Screen held awake' : 'Screen may sleep';
});
if (!screenLock.supported) el.awake.className = 'tag na';

let mode = 'target';
let targetEpoch = null;

/* Offset quality bands. The thresholds are not arbitrary: 100 ms is
   roughly where a human notices a clock disagreeing, 1 s is where the
   displayed second is simply wrong. Between those, the reading is usable
   but not trustworthy for anything tight. */
function offsetClass(ms) {
  const a = Math.abs(ms);
  return a < 100 ? 'q0' : a < 500 ? 'q1' : a < 1000 ? 'q2' : 'q3';
}

const clock = new ClockSync()
  .onStatus(s => {
    // in-flight phases paint amber with a pulse; the terminal phases are
    // left to onChange, which has the full result to report
    if (s.phase === 'synced' || s.phase === 'unsynced') return;
    const verb = { probing:'Probing', connecting:'Connecting to', sampling:'Sampling' }[s.phase];
    el.note.innerHTML =
      `<span class="pulse"></span>Clock source: <span class="q1">${verb} ${s.detail}</span>`;
  })
  .onChange(c => {
  const drift = c.base - (Date.now() - performance.now());   // device error
  el.offset.textContent = Number.isFinite(drift) ? (drift >= 0 ? '+' : '') + drift.toFixed(0) : '—';
  el.offset.className = c.synced ? offsetClass(drift) : 'q3';
  el.unc.textContent = c.uncertainty === Infinity ? '—' : c.uncertainty.toFixed(0);
  el.skew.textContent = c.skewPpm === null ? '—' : c.skewPpm.toFixed(1);

  // green means a remote server answered cleanly, amber means it answered
  // but below the quality bar, red means we are on the device clock alone
  const q = !c.synced ? 'q3' : c.degraded ? 'q1' : 'q0';
  el.note.innerHTML = `Clock source: <span class="${q}">${c.source}</span>` +
    (c.degraded ? ' <span class="q1">(degraded)</span>' : '') +
    (c.rtt ? ` · rtt ${c.rtt.toFixed(0)} ms` : '') +
    (c.timing === 'resource' ? ' · wire-timed' : ' · wall-timed') +
    (c.dispersion !== null ? ` · spread ${c.dispersion.toFixed(0)} ms` : '') +
    (c.granularity === 1000 ? ' — 1 s granularity, offset is approximate' : '');
  el.note.title = c.probeTable.length
    ? 'Measured RTT, nearest first: ' + c.probeTable.join(' · ')
    : '';
  if (mode === 'target' && targetEpoch !== null) apply();   // deadline follows the sync
  });

let lastMain = '';

const timer = new HiResCountdown({
  onTick: (remaining, step) => {
    const f = format(step);
    // the ms field changes every frame, the mm:ss field once a second.
    // Writing them separately avoids reparsing the whole digit string
    // 120 times a second, which innerHTML would do.
    if (f.main !== lastMain) { el.dMain.textContent = f.main; lastMain = f.main; }
    el.dFrac.textContent = '.' + f.frac;
    // scaleX composites; setting width would relayout the panel every frame
    el.bar.style.transform = `scaleX(${(remaining / timer.span).toFixed(5)})`;

    const secs = Math.ceil(remaining / 1000);
    if (timer.running && secs >= 1 && secs <= 5) cue.show(String(secs));
    else if (secs > 5) cue.hide();
  },
  onState: setState,
  onComplete: () => {
    navigator.vibrate?.([120, 60, 120]);
    cue.show('NOW', { word: true, holdMs: FLASH.DURATION });
    if (el.flashOn.checked) flash.fire();
    // hold the screen through the alert window, then let it sleep
    setTimeout(() => screenLock.release(), FLASH.DURATION);
  }
});

function setState(state) {
  el.led.className = 'led' + (state === 'running' ? ' on' : state === 'done' ? ' done' : '');
  el.digits.classList.toggle('expired', state === 'done');
  el.start.disabled = state === 'running' || state === 'done';
  el.pause.disabled = state !== 'running';
  el.start.textContent = state === 'paused' ? 'Resume' : 'Start';
  el.dur.disabled = state === 'running';
  el.tabDur.disabled = el.tabTgt.disabled = state === 'running';
  document.body.classList.toggle('running', state === 'running');
  useLoop();
}

function apply() {
  if (mode === 'duration') {
    if (timer.running) return;                 // a resync cannot disturb a live run
    stopPreview();
    const ms = Math.round((parseFloat(el.dur.value) || 1) * 1000);
    timer.load(ms);
    el.sub.textContent = '';
  } else {
    if (!el.tgt.value) { el.sub.textContent = 'Pick a target time'; return; }
    targetEpoch = resolveTarget(el.tgt.value);           // next occurrence
    if (timer.running) {
      // resync moved the clock: slide the deadline, re-place the pips,
      // and leave the run state alone
      const endPerf = targetEpoch - clock.base;
      timer.retarget(endPerf);
      beeper.arm(endPerf - performance.now());
      describeTarget(' · resynced');
      setState('running');
      return;
    }
    stopPreview();
    const remaining = Math.max(0, targetEpoch - clock.now());
    timer.load(remaining, Math.max(remaining, 1));
    startPreview();
    describeTarget();
  }
  setState('idle');
}

/* A time with no date means the next occurrence of that time. Resolve it
   against the synced clock, and roll to tomorrow once it has passed.

   The roll uses setDate(+1) rather than adding 86400000 ms. Across a DST
   boundary those disagree by an hour: "06:00 tomorrow" is 23 or 25 hours
   away on switchover days, and only the calendar arithmetic keeps the
   wall-clock time the user actually typed. */
function resolveTarget(value) {
  const [h, m, s = 0] = value.split(':').map(Number);
  const now = clock.now();
  const d = new Date(now);
  d.setHours(h, m, s, 0);
  if (d.getTime() <= now) d.setDate(d.getDate() + 1);
  return d.getTime();
}

function describeTarget(extra = '') {
  const unc = clock.uncertainty === Infinity ? '?' : clock.uncertainty.toFixed(0);
  const d = new Date(targetEpoch);
  // the date is derived, not typed, so name the day rather than print it
  const sameDay = d.toDateString() === new Date(clock.now()).toDateString();
  const when = (sameDay ? 'Today' : 'Tomorrow') + ' ' +
    d.toLocaleTimeString(undefined, { hour12:false, timeStyle:'medium' });
  el.sub.textContent = `${when} · ±${unc} ms${extra}`;
}

/* Idle preview. A wall-clock deadline keeps approaching whether or not
   the timer is armed, so an idle readout that was computed when the
   target was typed goes stale on its own. This recomputes from
   clock.now() four times a second while parked. */
let preview = false;
function startPreview() { preview = true; }
function stopPreview()  { preview = false; }

/* Arming a target countdown: resync first, then derive the interval
   from the fresh clock. The sync itself takes ~1 s, which costs
   nothing here — the deadline is an absolute epoch value, so however
   long the handshake takes, endPerf still lands on the same instant. */
async function armTarget() {
  if (!el.tgt.value) { el.sub.textContent = 'Pick a target time'; return; }
  el.start.disabled = true;
  el.start.textContent = 'Syncing';
  await clock.sync({ samples: 4 });

  targetEpoch = resolveTarget(el.tgt.value);             // re-resolve on arm
  const endPerf = targetEpoch - clock.base;             // epoch -> perf domain
  const remaining = endPerf - performance.now();

  if (remaining <= 0) {
    describeTarget(' · already passed');
    setState('idle');
    return;
  }
  stopPreview();
  timer.span = remaining;
  describeTarget(` · armed ${(remaining / 1000).toFixed(1)} s out`);
  timer.startAt(endPerf);
  beeper.arm(endPerf - performance.now());
}

function setMode(next) {
  mode = next;
  el.tabDur.setAttribute('aria-selected', next === 'duration');
  el.tabTgt.setAttribute('aria-selected', next === 'target');
  el.setDur.classList.toggle('hidden', next !== 'duration');
  el.setTgt.classList.toggle('hidden', next !== 'target');
  apply();
}

el.tabDur.onclick = () => setMode('duration');
el.tabTgt.onclick = () => setMode('target');
el.start.onclick  = () => {
  flash.stop();
  beeper.unlock();                       // must run in the gesture, before any await
  if (el.wakeOn.checked) screenLock.acquire();   // same reason: gesture, no await
  if (mode === 'target') { armTarget(); return; }
  timer.start();
  beeper.arm(timer.remaining);
};
el.pause.onclick  = () => { cue.hide(); beeper.cancel(); screenLock.release(); timer.pause(); if (mode === 'target') startPreview(); };
const pad2 = n => String(n).padStart(2, '0');

/* Reset returns the target to the next whole hour. A reset is a "start
   over from a clean value" action, and for a wall-clock deadline the
   clean value is the top of the hour, not whatever was typed. Computed
   from the synced clock and via setHours so it stays right across a DST
   boundary. */
function nextHour() {
  const d = new Date(clock.now());
  d.setHours(d.getHours() + 1, 0, 0, 0);
  return `${pad2(d.getHours())}:00:00`;
}

el.reset.onclick  = () => {
  flash.stop(); cue.hide(); beeper.cancel(); screenLock.release();
  timer.pause();
  if (mode === 'target') el.tgt.value = nextHour();
  apply();
};
el.beepOn.onchange = () => timer.running ? beeper.arm(timer.remaining) : beeper.cancel();
el.wakeOn.onchange = () => el.wakeOn.checked ? screenLock.acquire() : screenLock.release();

/* Collapsed panels hide state, which is how a muted alert goes unnoticed
   until it fails to fire. The summary line reports what is armed, so the
   group can stay shut without becoming opaque. */
function optSummary() {
  const on = [];
  if (el.flashOn.checked) on.push('flash');
  if (el.beepOn.checked)  on.push('beep');
  if (el.wakeOn.checked)  on.push('awake');
  el.optState.textContent = on.length ? on.join(' · ') : 'all off';
}
for (const box of [el.flashOn, el.beepOn, el.wakeOn]) {
  box.addEventListener('change', optSummary);
}
optSummary();
el.dur.onchange   = apply;
el.tgt.onchange   = apply;
el.sync.onclick   = async () => {
  el.sync.textContent = '···'; el.sync.disabled = true;
  await clock.sync();                    // primary first, same as any other sync
  el.sync.textContent = 'Sync'; el.sync.disabled = false;
};

/* Default target: the next whole minute at least 30 s away. A round
   boundary is what a wall-clock deadline usually is, and the 30 s
   floor keeps the seed from landing seconds after page load. */
const seed = new Date(Math.ceil((Date.now() + 30000) / 60000) * 60000);
const pad = n => String(n).padStart(2, '0');
el.tgt.value = `${pad(seed.getHours())}:${pad(seed.getMinutes())}:00`;

/* Wall clock readout. Runs off the synced clock, not Date.now(), so the
   time on screen is the corrected one — and it is the same value the
   deadline is computed against, which makes the offset auditable rather
   than a number you have to trust. */
const TZ = (() => {
  const m = -new Date().getTimezoneOffset();
  const s = m < 0 ? '-' : '+';
  return `UTC${s}${String(Math.floor(Math.abs(m) / 60)).padStart(2,'0')}:${String(Math.abs(m) % 60).padStart(2,'0')}`;
})();

function wallText(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
         `<em>.${Math.floor(d.getMilliseconds() / 100)}</em>`;
}

/* Two loops, one at a time.
   -----------------------------------------------------------------
   Running: rAF, full refresh rate. The tenths digit changes 10x/s and
   the cue has to land on the right frame, so nothing is throttled.

   Parked: setTimeout at 15 Hz. Nothing on screen moves faster than the
   half-second text update, so a 120 Hz rAF loop would burn eight frames
   for every one that changes a pixel. setTimeout rather than a gated
   rAF because a gated rAF still wakes the compositor every frame — the
   browser can only skip the work if we never ask for the frame.

   Text updates run at 10 Hz, gated on the 100 ms bucket. The 15 Hz loop
   ticks faster than that bucket, so no tenth is ever skipped — each one
   is caught within a tick of its boundary. */

const IDLE_HZ = 15;              // UI loop rate while parked
const TEXT_MS = 100;             // wall clock + preview refresh, 10 Hz

let frames = 0, mark = performance.now(), lastBucket = -1;
let idleTimer = null, rafId = null;

function meter() {
  frames++;
  const p = performance.now();
  if (p - mark >= 1000) {
    el.fps.textContent = Math.round(frames * 1000 / (p - mark));
    frames = 0; mark = p;
  }
}

/* The wall clock is painted in both loops. It is the reference the
   deadline was computed against, so hiding it during the run would
   remove exactly the reading needed to check the countdown against
   real time. The preview is idle-only: while running, the countdown
   loop owns the digits. */
function paintClock(withPreview) {
  const t = clock.now();
  const bucket = Math.floor(t / TEXT_MS);
  if (bucket === lastBucket) return;
  lastBucket = bucket;

  el.wallTime.innerHTML = wallText(t);
  const off = clock.base - (Date.now() - performance.now());
  el.wallMeta.innerHTML = clock.synced
    ? `${TZ} · <span class="${offsetClass(off)}">device ${off >= 0 ? '+' : ''}${off.toFixed(0)} ms</span>` +
      ` · ±${clock.uncertainty.toFixed(0)} ms`
    : `${TZ} · <span class="q3">device clock, unsynced</span>`;

  if (!withPreview) return;

  if (preview && mode === 'target' && el.tgt.value) {
    // a time-only target rolls forward the moment it passes, so re-resolve
    // every tick and reset the bar span when the day flips
    const next = resolveTarget(el.tgt.value);
    if (next !== targetEpoch) {
      targetEpoch = next;
      timer.span = Math.max(next - t, 1);
      describeTarget();
    }
    timer.load(Math.max(0, targetEpoch - t), timer.span);
  }
}

function idleLoop() {
  meter();
  paintClock(true);
  idleTimer = setTimeout(idleLoop, 1000 / IDLE_HZ);
}

function runLoop() {
  if (!timer.running) { rafId = null; return; }
  meter();
  paintClock(false);        // clock ticks at 10 Hz, gated the same way
  rafId = requestAnimationFrame(runLoop);
}

// called on every state change: exactly one loop is ever alive
function useLoop() {
  clearTimeout(idleTimer); idleTimer = null;
  if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  frames = 0; mark = performance.now(); lastBucket = -1;
  if (timer.running) rafId = requestAnimationFrame(runLoop);
  else idleTimer = setTimeout(idleLoop, 0);
}

setMode('target');                              // opens on the wall-clock deadline
clock.sync();                                   // sync on load
setInterval(() => clock.sync({ samples: 3 }), 5 * 60 * 1000);  // hold discipline
</script>
</body>
</html>
